[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixlip"
version = "0.1.0"
description = "Unified interface and knowledge distillation toolkit for ML interatomic potentials"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "ase>=3.23",
    "pymatgen>=2024.6",
    # Config & validation
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Training orchestration
    "lightning>=2.2",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3.10"]
chgnet = ["chgnet>=0.3.8"]
sevennet = ["sevenn>=0.10.0"]
fairchem = ["fairchem-core>=1.5"]
matgl = ["matgl>=1.1"]
alignn = ["alignn>=2024.1"]
orb = ["orb-models>=0.4"]

all-models = [
    "mixlip[mace]",
    "mixlip[chgnet]",
    "mixlip[sevennet]",
    "mixlip[matgl]",
    "mixlip[alignn]",
    "mixlip[orb]",
]

data = [
    "h5py>=3.10",
    "mp-api>=0.41",
    "torch-geometric>=2.5",
]

train = [
    "wandb>=0.17",
    "tensorboard>=2.16",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
mixlip = "mixlip.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mixlip"]

[tool.uv]
dev-dependencies = ["mixlip[dev]"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: requires a real backend model to be installed/downloaded (slow, may need network)",
]
