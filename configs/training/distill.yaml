# Knowledge distillation: MACE-MP (teacher) → M3GNet (student)
# The student trains on DFT labels + teacher soft predictions.

model:
  backend: m3gnet   # student backbone for normal training steps
  checkpoint: pretrained
  device: cuda
  dtype: float32
  compute_stress: true

data:
  train_path: data/train.extxyz
  val_path: data/val.extxyz
  format: extxyz
  cutoff_radius: 5.0
  max_neighbors: 50
  batch_size: 16
  num_workers: 4

loss:
  energy_weight: 1.0
  forces_weight: 100.0
  stress_weight: 10.0
  criterion: huber
  huber_delta: 0.01

optimizer: adamw
lr: 5.0e-4
weight_decay: 1.0e-5
max_epochs: 300
patience: 50
grad_clip_norm: 10.0
use_ema: true
ema_decay: 0.99
scheduler: cosine

distill:
  teacher:
    backend: mace
    checkpoint: mace-mp
    model_size: large
    device: cuda
    dtype: float32

  student:
    backend: m3gnet
    checkpoint: pretrained
    device: cuda
    dtype: float32

  temperature: 1.0
  alpha_task: 0.5      # weight on hard DFT labels
  alpha_distill: 0.5   # weight on teacher predictions

  loss:
    energy_weight: 1.0
    forces_weight: 100.0
    stress_weight: 10.0
    criterion: huber
    huber_delta: 0.01
